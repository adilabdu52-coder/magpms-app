<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>MAGPMS — Magmaps</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="entry">
  <div class="entry-card">
    <div class="entry-logo"><span data-icon="compass"></span></div>
    <h1>MAGPMS</h1>
    <p class="tagline">Magmaps — field mapping &amp; site control</p>

    <div class="role-cards">
      <button class="role-card" id="btn-staff">
        <span class="rc-icon"><span data-icon="user"></span></span>
        <span class="grow">
          <span class="rc-title">Staff</span><br>
          <span class="rc-sub">View the map, sites and markers</span>
        </span>
      </button>
      <button class="role-card admin" id="btn-admin">
        <span class="rc-icon"><span data-icon="shield"></span></span>
        <span class="grow">
          <span class="rc-title">Admin</span><br>
          <span class="rc-sub">Full control — manage markers, data &amp; settings</span>
        </span>
      </button>
    </div>

    <p class="continue muted" id="continue-hint"></p>
  </div>
</div>

<!-- Admin PIN modal -->
<div class="modal-backdrop" id="modal-admin-pin">
  <div class="modal">
    <div class="modal-head">
      <h3>Admin access</h3>
      <button class="icon-btn" data-close aria-label="Close"><span data-icon="close"></span></button>
    </div>
    <p class="muted">Enter the admin PIN to continue. Default is <strong>1234</strong> until changed in Settings.</p>
    <div class="field mt-4">
      <input type="password" inputmode="numeric" maxlength="8" class="input pin-input" id="admin-pin" placeholder="••••" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="btn-pin-go">Unlock</button>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  App.renderIcons();

  function go(role) {
    Store.setRole(role);
    location.href = role === "admin" ? "admin.html" : "staff.html";
  }

  document.getElementById("btn-staff").addEventListener("click", function () { go("staff"); });

  document.getElementById("btn-admin").addEventListener("click", function () {
    App.openModal("modal-admin-pin");
    setTimeout(function () { document.getElementById("admin-pin").focus(); }, 100);
  });

  function tryPin() {
    var v = document.getElementById("admin-pin").value;
    if (v === Store.getSettings().pin) {
      document.getElementById("admin-pin").value = "";
      go("admin");
    } else {
      App.toast("Wrong PIN", "danger");
    }
  }
  document.getElementById("btn-pin-go").addEventListener("click", tryPin);
  document.getElementById("admin-pin").addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryPin();
  });

  // "Continue as" hint from last used role
  var last = null;
  try { last = localStorage.getItem("magpms.lastRole"); } catch (e) {}
  if (last === "staff" || last === "admin") {
    var hint = document.getElementById("continue-hint");
    hint.innerHTML = 'Last time you signed in as <a href="#" id="continue-link"></a>';
    var link = document.getElementById("continue-link");
    link.textContent = last === "admin" ? "Admin" : "Staff";
    link.addEventListener("click", function (e) {
      e.preventDefault();
      if (last === "admin") {
        App.openModal("modal-admin-pin");
        setTimeout(function () { document.getElementById("admin-pin").focus(); }, 100);
      } else {
        go("staff");
      }
    });
  }
})();
</script>
</body>
</html>
